name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (business rules, backups, desktop compatibility)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-distribution-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
