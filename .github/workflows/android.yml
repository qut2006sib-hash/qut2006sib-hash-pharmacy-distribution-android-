name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (business rules, backups, desktop compatibility)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Inspect APKs (reported as annotations)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            info=$("$BT/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|native-code|application-debuggable|testOnly)" | tr '\n' ' ')
            cert=$("$BT/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|certificate SHA-256" | tr '\n' ' ')
            echo "::notice title=$(basename "$apk")::$info | $cert"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-distribution-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

      # A plain .apk download for phones: no zip, no GitHub login needed.
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "pharmacy-distribution-${tag}.apk"
          sha256sum "pharmacy-distribution-${tag}.apk" > "pharmacy-distribution-${tag}.apk.sha256"
          gh release create "$tag" "pharmacy-distribution-${tag}.apk" "pharmacy-distribution-${tag}.apk.sha256" \
            --target "${{ github.sha }}" --title "Build ${{ github.run_number }}" --latest \
            --notes "ثبّت ملف pharmacy-distribution-${tag}.apk مباشرة على الهاتف (أندرويد 5 أو أحدث)."
