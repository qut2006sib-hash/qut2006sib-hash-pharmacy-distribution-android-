name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (business rules, backups, desktop compatibility)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Inspect APKs (reported as annotations)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            info=$("$BT/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" | tr '\n' ' ')
            cert=$("$BT/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|certificate SHA-256" | tr '\n' ' ')
            echo "::notice title=$(basename "$apk")::$info | $cert"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-distribution-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
